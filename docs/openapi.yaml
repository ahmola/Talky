openapi: 3.0.3
info:
  title: Talking Messenger API
  description: 실시간 메신저 "Talking"의 인증 및 친구 관리 REST API 명세
  version: 1.0.0
servers:
  - url: /api
paths:
  /auth/register:
    post:
      summary: 회원가입
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: user123
                password:
                  type: string
                  example: password123
                nickname:
                  type: string
                  example: 홍길동
      responses:
        '201':
          description: 회원가입 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  userId:
                    type: string
        '400':
          description: 잘못된 요청 (이미 존재하는 유저네임 등)

  /auth/login:
    post:
      summary: 로그인
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: 로그인 성공 및 토큰 반환
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  userId:
                    type: string
                  nickname:
                    type: string
        '401':
          description: 로그인 실패 (인증 정보 불일치)

  /friends:
    get:
      summary: 친구 목록 조회
      operationId: getFriends
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 친구 목록 반환
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    userId:
                      type: string
                    username:
                      type: string
                    nickname:
                      type: string
                    statusMessage:
                      type: string
                    online:
                      type: boolean
    post:
      summary: 친구 추가
      operationId: addFriend
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
              properties:
                username:
                  type: string
      responses:
        '200':
          description: 친구 추가 성공
        '404':
          description: 해당 유저를 찾을 수 없음
        '400':
          description: 이미 친구이거나 자기 자신을 추가하려는 경우

  /friends/{userId}:
    delete:
      summary: 친구 삭제
      operationId: deleteFriend
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 친구 삭제 성공

  /rooms:
    get:
      summary: 참여 중인 채팅방 목록 조회
      operationId: getRooms
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 채팅방 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    roomId:
                      type: string
                    name:
                      type: string
                    type:
                      type: string
                      enum: [direct, group]
                    updatedAt:
                      type: string
                      format: date-time
    post:
      summary: 채팅방 생성
      operationId: createRoom
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - type
                - members
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum: [direct, group]
                members:
                  type: array
                  items:
                    type: string
                  description: 참여할 유저 ID 목록 (본인 제외 또는 포함)
      responses:
        '201':
          description: 채팅방 생성 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  roomId:
                    type: string

  /rooms/{roomId}/messages:
    get:
      summary: 특정 채팅방의 과거 메시지 조회 (동기화용)
      operationId: getRoomMessages
      security:
        - BearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: before
          in: query
          required: false
          description: 특정 시간 이전의 메시지만 조회 (페이징용)
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 메시지 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    messageId:
                      type: string
                    roomId:
                      type: string
                    senderId:
                      type: string
                    senderNickname:
                      type: string
                    content:
                      type: string
                      example: "안녕하세요!"
                    createdAt:
                      type: string
                      format: date-time

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
